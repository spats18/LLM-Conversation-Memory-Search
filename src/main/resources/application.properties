spring.application.name=llm-memory
spring.config.import=optional:application-local.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/llmmemory
spring.datasource.username=postgres

# DB connection params for PgVectorEmbeddingStore (LangChain4j does not accept a DataSource)
app.db.host=localhost
app.db.port=5432
app.db.name=llmmemory
app.db.user=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.api.model=gpt-4o-mini
openai.api.embedding-model=text-embedding-3-small

# Chunking
app.chunking.size=500
app.chunking.overlap=50

# Pagination                                                                                                                         
spring.data.web.pageable.default-page-size=20                                                                                                                     
spring.data.web.pageable.max-page-size=100 

# Search
# max-results is raw chunk matches before deduplication — set higher than the number of
# conversations we want returned because multiple chunks from the same conversation will match
app.search.max-results=20
# min-score is cosine similarity threshold (0–1); 0.5 filters noise while avoiding silent
# zero-result responses — tune upward once real conversations are indexed
app.search.min-score=0.5
